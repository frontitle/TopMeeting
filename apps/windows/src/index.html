<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>TopMeeting</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><span>▥</span> TopMeeting</div><p class="muted">你的会议工作空间 · Windows 预览版</p><button id="create" class="primary">＋ 新建会议</button><input id="search" placeholder="搜索会议、纪要或说话人"><label class="check"><input id="trash" type="checkbox">最近删除</label><nav id="meetings"></nav><button id="settings">⚙ 设置与扩展</button></aside>
<main><header><div><small>工作空间 / 会议记录</small><input id="title" aria-label="会议主题" placeholder="选择或新建会议"><p id="meta" class="muted"></p></div><div class="actions"><span id="time">00:00</span><button id="record" class="primary">开始录音</button><button id="pause" hidden>暂停</button></div></header>
<div id="notice" role="status"></div><div class="workspace"><section><div class="section-head"><h2>会议实录</h2><button id="transcribe">转写录音</button></div><p class="muted">预览版采用会后转写；语音服务需独立配置。声纹识别尚未接入。</p><div class="recordings"><select id="recordings" aria-label="选择录音"></select><button id="play">播放原音</button><audio id="audio" controls hidden></audio></div><div id="lines"></div><button id="add">＋ 添加一段实录</button><label class="context">补充语境<textarea id="context" placeholder="专业术语、姓名，以及理解这场会议需要知道的背景…"></textarea></label></section><section class="notes"><div class="section-head"><h2>结构化纪要</h2><button id="summarize">生成总结</button></div><p class="muted">仅按需生成，相同内容不重复提交。</p><pre id="notes">连接模型后，会议的重点与决策会呈现在这里。</pre><div class="bottom"><button id="export">导出 Markdown</button><button id="delete">删除会议</button></div></section></div></main>
<dialog id="dialog"><form id="config"><div class="section-head"><h2>设置与扩展</h2><button type="button" id="close">关闭</button></div><p class="muted">令牌由 Windows 系统加密保存；留空保留已有令牌。</p><label>总结服务<select name="kind"><option value="openclaw">远程 OpenClaw</option><option value="compatible">OpenAI-compatible API</option></select></label><label>服务地址<input name="base" placeholder="https://example.com/v1" required></label><label>模型 / Agent<input name="model" placeholder="openclaw/main" required></label><label>令牌<input name="token" type="password" autocomplete="off"></label><label>纪要语言<select name="language"><option value="zh">简体中文</option><option value="en">English</option></select></label><h3>语音转写服务（可选）</h3><p class="muted">兼容 audio/transcriptions 的服务。点击“转写录音”时上传录音，可能独立计费。OpenClaw 的总结额度不包含此项。</p><label>转写地址<input name="asrBase" placeholder="https://example.com/v1"></label><label>转写模型<input name="asrModel" placeholder="填写服务提供的模型名"></label><label>转写令牌<input name="asrToken" type="password" autocomplete="off"></label><p>飞书、自动声纹、实时聆听浮窗将在后续 Windows 版本接入。</p><button class="primary" type="submit">保存配置</button><p id="configError" role="alert"></p></form></dialog>
<script src="renderer.js"></script></body></html>
