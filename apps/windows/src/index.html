<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'"><title>TopMeeting</title><link rel="stylesheet" href="style.css"></head><body>
<aside><div class="brand"><img src="logo.png" alt=""> TopMeeting</div><button id="create" class="primary">＋ 新建会议</button><input id="search" placeholder="搜索会议、纪要或说话人"><label class="check"><input id="trash" type="checkbox">最近删除</label><nav id="meetings"></nav><button id="settings">⚙ 设置与扩展</button></aside>
<main><header><div><small>会议记录</small><input id="title" aria-label="会议主题" placeholder="选择或新建会议"><p id="meta" class="muted"></p><button id="people">说话人</button></div><div class="actions"><span id="time">00:00</span><button id="record" class="primary">开始录音</button><button id="pause" hidden>暂停</button></div></header>
<div id="notice" role="status"></div><div id="doclinks"></div>
<section id="prepare" class="inline-guide" hidden aria-live="polite">
  <div><strong id="prepareTitle">准备本地转写</strong><p id="prepareInfo">首次需下载约 220 MB 模型，用于离线字幕和说话人识别。</p></div>
  <div class="guide-actions"><button id="prepareAction" class="primary">下载模型</button><button id="onlyAudio">先只录音</button><button id="hidePrepare" aria-label="收起模型提示">收起</button></div>
</section>
<section id="welcome" hidden><img src="logo.png" width="54" height="54" alt=""><h1>开始第一场会议</h1><p>新建会议，再开始录音。</p></section><div class="workspace"><section><div class="section-head"><h2>会议实录</h2></div><div class="recordings"><select id="recordings" aria-label="选择录音"></select><button id="play">播放原音</button><audio id="audio" controls hidden></audio></div><datalist id="knownSpeakers"></datalist><div id="lines"></div><p id="emptyLines" class="empty-copy">开始录音后，完整发言会出现在这里。</p><button id="add">＋ 添加发言</button><label class="context">补充语境<textarea id="context" placeholder="专业术语、姓名，以及理解这场会议需要知道的背景…"></textarea></label></section><section class="notes"><div class="section-head"><h2>结构化纪要</h2><button id="summarize">生成总结</button></div><div id="notes"></div><div id="docHint" class="inline-guide" hidden><div><strong>会议文档</strong><p>连接账号，下次开会时自动建档。</p></div><div class="guide-actions"><button id="connectDocs">连接文档</button><button id="hideDocHint" aria-label="不再提示会议文档">忽略</button></div></div><div class="bottom"><button id="export">导出 Markdown</button><button id="delete">删除会议</button></div></section></div></main>
<dialog id="dialog"><form id="config"><div class="section-head"><h2>设置与扩展</h2><button type="button" id="close">关闭</button></div><p class="muted">凭据保存在本机。令牌留空时沿用已有配置。</p><label>总结服务<select name="kind"><option value="openclaw">远程 OpenClaw</option><option value="compatible">OpenAI-compatible API</option></select></label><label>服务地址<input name="base" placeholder="https://example.com/v1" required></label><label>模型 / Agent<input name="model" placeholder="openclaw/main" required></label><label>令牌<input name="token" type="password" autocomplete="off"></label><label>纪要语言<select name="language"><option value="zh">简体中文</option><option value="en">English</option></select></label><button class="primary" type="submit">保存模型配置</button><p id="configError" role="alert"></p><h3>本地语音与声纹</h3><p class="muted">首次下载约 220 MB 模型。之后无需联网即可显示字幕、区分说话人。</p><button type="button" id="models">下载或检查语音模型</button><p id="modelStatus"></p><h3>会议文档</h3><button type="button" id="accounts">管理绑定账号</button></form></dialog>
<dialog id="peopleDialog"><div class="section-head"><h2>本场说话人</h2><button id="closePeople">关闭</button></div><p class="muted">修改姓名或选择已有人名，将应用到本场声纹和相关发言。</p><div id="peopleList"></div><p id="personMessage"></p></dialog>
<dialog id="accountDialog"><div class="section-head"><h2>会议文档账号</h2><button id="closeAccounts">关闭</button></div><label>文档平台<select id="service"></select></label><p id="accountStatus"></p><div id="accountFields"></div><label class="check"><input type="checkbox" id="autoDoc"> 开始录音时创建会议文档</label><div class="accountActions"><button id="bindAccount" class="primary">绑定账号</button><button id="saveAuto">保存开关</button><button id="unlink">解除绑定</button></div><p id="accountMessage" role="status"></p></dialog>
<script src="renderer.js"></script><script src="capture.js"></script><script src="accounts.js"></script></body></html>
