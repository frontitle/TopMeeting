name: Publish Windows preview draft
on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful Windows client build run ID
        required: true
        type: string
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.build_run_id }}
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > /tmp/build.json
          python3 - <<'PY'
          import json,os
          run=json.load(open('/tmp/build.json'))
          assert run['name']=='Windows client' and run['conclusion']=='success'
          assert run['head_branch']=='main' and run['event'] in ['push','workflow_dispatch']
          assert run['head_repository']['full_name']==os.environ['GH_REPO']
          with open(os.environ['GITHUB_ENV'],'a') as out: out.write('BUILD_SHA='+run['head_sha']+'\n')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: TopMeeting-Windows-x64
          path: assets
          github-token: ${{ github.token }}
          run-id: ${{ inputs.build_run_id }}
      - name: Verify assets and upload to the matching draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd assets
          sha256sum --check SHA256SUMS.txt
          cd ..
          gh api "repos/$GH_REPO/contents/apps/windows/package.json?ref=$BUILD_SHA" --jq .content | base64 --decode > /tmp/package.json
          version=$(python3 -c 'import json,re; v=json.load(open("/tmp/package.json"))["version"]; assert re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+",v); print(v)')
          tag="windows-v${version}-preview.1"
          setup="assets/TopMeeting-${version}-windows-x64-setup.exe"
          zip="assets/TopMeeting-${version}-windows-x64.zip"
          test -s "$setup" && test -s "$zip" && test -s assets/latest.yml
          gh release view "$tag" --json isDraft,targetCommitish > /tmp/draft.json
          python3 - <<'PYDRAFT'
          import json, os
          d = json.load(open('/tmp/draft.json'))
          assert d['isDraft'] and d['targetCommitish'] == os.environ['BUILD_SHA']
          PYDRAFT
          gh release upload "$tag" "$setup" "$zip" assets/SHA256SUMS.txt assets/latest.yml --clobber
