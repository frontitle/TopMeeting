name: Windows client
on:
  push:
    branches: [main]
    paths: ['apps/windows/**', 'packages/documents/document-services.cjs', '.github/workflows/windows.yml', 'voice_engine/**', 'LICENSE', 'NOTICE', 'THIRD_PARTY_NOTICES.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check first-use flows, retry, accessibility states and dark layout
        run: node test/ui-journey.cjs
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python speech/test_install.py
      - name: Bundle isolated Python voice runtime
        shell: pwsh
        run: ./speech/build-runtime.ps1
      - name: Verify offline recognition with a four-person Mandarin recording
        shell: pwsh
        run: |
          $models = Join-Path $env:RUNNER_TEMP 'topmeeting-models'
          $fixture = Join-Path $env:RUNNER_TEMP 'meeting.wav'
          Invoke-WebRequest 'https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/0-four-speakers-zh.wav' -OutFile $fixture
          if ((Get-FileHash $fixture).Hash.ToLower() -ne 'bedf036caed208386c67b4ef4b11f83d74dd0d420b102163a1c33cd09cde7010') { throw 'Unexpected audio fixture' }
          & ./runtime/python.exe ./runtime/worker.py install $models unused
          if ($LASTEXITCODE -ne 0) { throw 'Model installation failed' }
          & ./runtime/python.exe speech/replay.py ./runtime/python.exe runtime/worker.py $models $fixture
          if ($LASTEXITCODE -ne 0) { throw 'Offline replay failed' }
          "TOPMEETING_SMOKE_MODELS=$models" | Out-File -FilePath $env:GITHUB_ENV -Append
          "TOPMEETING_SMOKE_FIXTURE=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Launch packaged Windows client and verify storage bridge
        shell: pwsh
        run: |
          $result = Join-Path $env:TEMP 'topmeeting-smoke-result.txt'
          Remove-Item $result -ErrorAction SilentlyContinue
          $process = Start-Process -FilePath '.\release\win-unpacked\TopMeeting.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $process.WaitForExit(120000)) { $process.Kill(); throw 'Packaged application timed out' }
          if ($process.ExitCode -ne 0) { throw "Application exited with $($process.ExitCode)" }
          if (-not (Test-Path $result)) { throw 'No smoke-test receipt' }
          if ((Get-Content $result -Raw) -ne 'PASS') { throw 'Smoke test failed' }
      - name: Hash release assets
        shell: pwsh
        run: |
          Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object { $hash = Get-FileHash $_.FullName -Algorithm SHA256; "$($hash.Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-Item "release/TopMeeting-$version-windows-x64-setup.exe"
          $sha = [Convert]::ToBase64String([Convert]::FromHexString((Get-FileHash $installer.FullName -Algorithm SHA512).Hash))
          @("version: $version", "files:", "  - url: $($installer.Name)", "    sha512: $sha", "    size: $($installer.Length)", "path: $($installer.Name)", "sha512: $sha") | Set-Content release/latest.yml -Encoding utf8NoBOM
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: TopMeeting-Windows-x64
          path: |
            apps/windows/release/*.exe
            apps/windows/release/*.zip
            apps/windows/release/SHA256SUMS.txt
            apps/windows/release/latest.yml
          if-no-files-found: error
          retention-days: 30
